<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera OCR</title>
    <!-- Bootstrap CSS (optional, for styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">Mobile Camera OCR</h1>

        <div class="video-container mb-3">
            <video id="video" playsinline autoplay muted></video>
            <!-- Canvas for capturing frames (can be hidden) -->
            <canvas id="canvas" style="display: none;"></canvas>
        </div>

        <div class="d-grid gap-2 mb-3">
            <button id="captureBtn" class="btn btn-primary" disabled>
                 <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" id="initSpinner"></span>
                 <span id="captureBtnText">Initializing...</span>
            </button>
        </div>

        <div id="status" class="alert alert-info" role="alert">
            Point your camera at some text and press Capture.
        </div>

        <div class="mb-3">
            <label for="resultText" class="form-label">Extracted Text:</label>
            <textarea id="resultText" class="form-control" rows="6" readonly></textarea>
        </div>

        <div class="d-grid gap-2">
            <button id="copyBtn" class="btn btn-secondary" disabled>Copy Text</button>
        </div>

    </div>

    <!-- Tesseract.js (loads the library) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

    <!-- Bootstrap JS Bundle (optional, for components if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
