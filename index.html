<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera OCR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">Mobile Camera OCR</h1>

        <div class="video-container mb-3">
            <video id="video" playsinline autoplay muted></video>
            <!-- Canvas for capturing frames (can be hidden but useful for export) -->
            <canvas id="canvas" style="display: none;"></canvas>
             <!-- Add an img element to display the captured frame (optional visual feedback) -->
             <img id="capturedImage" src="#" alt="Captured Frame" style="display: none; max-width: 100%; border: 1px solid #ddd; margin-top: 10px;">
        </div>

        <!-- Camera Controls -->
        <div class="d-flex justify-content-center gap-2 mb-3">
             <button id="startCameraBtn" class="btn btn-success">Start Camera</button>
             <button id="stopCameraBtn" class="btn btn-danger" disabled>Stop Camera</button>
        </div>

        <!-- Action Controls -->
        <div class="d-grid gap-2 mb-3">
            <button id="captureRecognizeBtn" class="btn btn-primary" disabled>
                 <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" id="ocrSpinner" style="display: none;"></span>
                 <span id="captureBtnText">Capture & Recognize</span>
            </button>
            <button id="exportImageBtn" class="btn btn-info" disabled>Export Captured Image</button>
        </div>


        <div id="status" class="alert alert-info" role="alert">
            Press "Start Camera", then point at text and press "Capture & Recognize".
        </div>

        <div class="mb-3">
            <label for="resultText" class="form-label">Extracted Text:</label>
            <textarea id="resultText" class="form-control" rows="5" readonly></textarea>
        </div>

        <div class="d-grid gap-2">
            <button id="copyBtn" class="btn btn-secondary" disabled>Copy Text</button>
        </div>

    </div>

    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
