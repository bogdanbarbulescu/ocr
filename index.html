<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Make sure the site is responsive and scales correctly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera OCR</title>

    <!-- Bootstrap CSS from CDN for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Link to your custom CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Optional: Add a simple favicon -->
    <!-- <link rel="icon" href="favicon.ico" type="image/x-icon"> -->

</head>
<body>
    <!-- Main container for content, using Bootstrap's container class for padding and centering -->
    <div class="container mt-3 mb-5"> <!-- Added mb-5 for extra space at the bottom -->

        <h1 class="text-center mb-4">Mobile Camera OCR</h1>

        <!-- Container for the video feed and the hidden canvas -->
        <div class="video-container mb-3 shadow-sm rounded"> <!-- Added shadow and rounded corners -->
            <!-- Video element to display the camera stream -->
            <!-- 'playsinline' helps prevent fullscreen on iOS Safari -->
            <!-- 'autoplay' tries to start playing automatically -->
            <!-- 'muted' is often required for autoplay to work without user interaction -->
            <video id="video" playsinline autoplay muted></video>

            <!-- Canvas element used internally to capture a frame from the video -->
            <!-- It's hidden from the user with CSS (display: none;) -->
            <canvas id="canvas" style="display: none;"></canvas>

             <!-- Image element to display the captured frame (optional but good feedback) -->
             <!-- Initially hidden, src is set by JS after capture -->
             <img id="capturedImage" src="#" alt="Captured Frame" class="img-fluid rounded" style="display: none; border: 1px solid #dee2e6; margin-top: 10px;">
             <!-- img-fluid makes the image responsive -->
        </div>

        <!-- Camera Control Buttons -->
        <div class="d-flex justify-content-center gap-2 mb-3">
             <!-- Button to start the camera stream -->
             <!-- Initially enabled, JS will disable if stream starts -->
             <button id="startCameraBtn" class="btn btn-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera-video-fill me-1" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.11-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2z"/>
                </svg>
                Start Camera
            </button>
             <!-- Button to stop the camera stream -->
             <!-- Initially disabled, JS enables when stream is active -->
             <button id="stopCameraBtn" class="btn btn-danger" disabled>
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stop-circle-fill me-1" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M6.5 5A1.5 1.5 0 0 0 5 6.5v3A1.5 1.5 0 0 0 6.5 11h3A1.5 1.5 0 0 0 11 9.5v-3A1.5 1.5 0 0 0 9.5 5z"/>
                 </svg>
                 Stop Camera
             </button>
        </div>

        <!-- Action Control Buttons -->
        <div class="d-grid gap-2 mb-3">
            <!-- Button to capture the current frame and perform OCR -->
            <!-- Initially disabled, JS enables when camera and Tesseract are ready -->
            <button id="captureRecognizeBtn" class="btn btn-primary btn-lg" disabled> <!-- Made button larger -->
                 <!-- Spinner icon, shown during processing via JS -->
                 <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" id="ocrSpinner" style="display: none;"></span>
                 <!-- Text part of the button, updated by JS -->
                 <span id="captureBtnText">Capture & Recognize</span>
            </button>

            <!-- Button to export/download the captured image -->
            <!-- Initially disabled, JS enables after a successful capture -->
            <button id="exportImageBtn" class="btn btn-info" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download me-1" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
                </svg>
                Export Captured Image
            </button>
        </div>


        <!-- Status display area, updated by JS -->
        <div id="status" class="alert alert-info" role="alert">
            Initializing OCR Engine... Please wait.
        </div>

        <!-- Results Area -->
        <div class="mb-3">
            <label for="resultText" class="form-label">Extracted Text:</label>
            <!-- Textarea to display the OCR results -->
            <!-- 'readonly' prevents user editing -->
            <textarea id="resultText" class="form-control" rows="6" readonly placeholder="Recognized text will appear here..."></textarea>
        </div>

        <!-- Copy Button -->
        <div class="d-grid gap-2">
            <!-- Button to copy the text from the textarea -->
            <!-- Initially disabled, JS enables when there is text -->
            <button id="copyBtn" class="btn btn-secondary" disabled>
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard me-1" viewBox="0 0 16 16">
                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
                 </svg>
                 Copy Text
            </button>
        </div>

    </div> <!-- End of container -->

    <!-- JavaScript Libraries -->
    <!-- Tesseract.js library from CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

    <!-- Bootstrap JavaScript Bundle (includes Popper) from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Your Custom JavaScript file -->
    <!-- Place this last so the DOM elements are loaded before the script runs -->
    <script src="script.js"></script>
</body>
</html>
